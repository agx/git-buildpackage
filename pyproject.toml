[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
# Ignore line length (E501) for now
# We fix the other ones one by one
lint.ignore = [ "E501",
          # Do not use mutable data structures for argument defaults
          "B006",
          "B018",
          # Do not catch "Exception"
          "BLE001",
          # List comprehension
          "C403",
          # Dict comprehension
          "C404",
          # Literal
          "C405", "C408",
          # Generator expression
          "C417",
          # Timezones
          "DTZ001", "DTZ005", "DTZ007",
          # Avoid "".join()
          "FLY002",
          # File writing
          "FURB122",
          # Drop .readlines()
          "FURB129",
          # Regex aliases
          "FURB167",
          # Unsorted imports
          "I001",
          # Invalid module name
          "N999",
          "PLW1509",
          # Prefer `next(...)` over single element slice
          "RUF015",
          # Mutable default value for class attribute
          "RUF012",
          # Use _ for unused vars
          "RUF059",
          # Remove unused noqa (conflicts with flake8)
          "RUF100",
          # Use of exec
          "S102",
          # Use a single `if` statement instead of nested `if` statements
          "SIM102",
          # Return condition directly
          "SIM103",
          # Combine `if` branches using logical `or` operator
          "SIM114",
          # Use a context manager for opening files
          "SIM115",
          # Use `key in dict` instead of `key in dict.keys()`
          "SIM118",
          # Use `bool(...)` instead of `True if ... else False`
          "SIM210",
          # Use `not ...` instead of `False if ... else True`
          "SIM211",
          # pyupgrade checks
          "UP003",
          # Use plain super()
          "UP008",
          # Use format specifiers instead of percent format
          "UP031",
          "TRY002"
         ]
